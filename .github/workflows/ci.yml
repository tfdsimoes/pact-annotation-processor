name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
      - name: Build and test
        run: ./mvnw -B clean install
      - name: Verify packaged consumer
        run: ./mvnw -B -f src/test/packaged-consumer/pom.xml clean compile

  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: .\mvnw.cmd -B clean install
      - name: Verify packaged consumer
        run: .\mvnw.cmd -B -f src/test/packaged-consumer/pom.xml clean compile
